<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Henna C | One Of Them Days (Simple Player)</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&family=Cinzel:wght@600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">

    <style>
      :root {
        --primary: #ffd54f; /* Metallic Gold */
        --primary-glow: rgba(255, 213, 79, 0.5);
        --purple: #9c27b0;
        --purple-glow: rgba(156, 39, 176, 0.4);
        --bg: #030303;
        --card-bg: rgba(255, 255, 255, 0.02);
        --border: rgba(255, 255, 255, 0.06);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      body {
        background: var(--bg);
        color: #fff;
        font-family: 'Outfit', sans-serif;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      /* ── LOOPING BACKGROUND VIDEO (LIGHTNING STRIKES) ── */
      #bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 2;
        object-fit: cover;
        pointer-events: none;
        opacity: 0.85;
        filter: brightness(0.35) saturate(1.0);
        transition: opacity 0.6s ease, transform 0.1s ease, filter 0.1s ease;
        will-change: transform, filter, opacity;
      }

      /* ── AUDIO-REACTIVE BLUR BACKGROUND (FALLBACK/AMBIENT) ── */
      .ambient-bg-container {
        position: fixed;
        top: -5%;
        left: -5%;
        width: 110vw;
        height: 110vh;
        z-index: 1;
        overflow: hidden;
        animation: kenBurns 45s infinite alternate ease-in-out;
        pointer-events: none;
      }

      .ambient-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('assets/one-of-them-days.png');
        background-size: cover;
        background-position: center;
        filter: blur(25px) brightness(0.28) saturate(1.3);
        transform: scale(1.05);
        opacity: 1;
        transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.2, 1), filter 0.3s ease, opacity 0.6s ease;
        will-change: transform, filter, opacity;
      }

      @keyframes kenBurns {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(-1.5%, 1%) scale(1.04); }
        100% { transform: translate(1%, -1.5%) scale(1); }
      }

      .bg-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 4;
        background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.8) 90%),
                    linear-gradient(to bottom, rgba(5,5,5,0.3) 0%, rgba(0,0,0,0.9) 100%);
        pointer-events: none;
      }

      @keyframes borderGlowShift {
        0%, 100% { border-color: rgba(255, 213, 79, 0.15); box-shadow: 0 50px 100px rgba(0,0,0,0.8), 0 0 50px rgba(255, 213, 79, 0.02); }
        50% { border-color: rgba(156, 39, 176, 0.15); box-shadow: 0 50px 100px rgba(0,0,0,0.8), 0 0 50px rgba(156, 39, 176, 0.02); }
      }

      /* ── GLASS CONTAINER ── */
      .player-container {
        position: relative;
        z-index: 10;
        width: 92%;
        max-width: 1100px;
        height: 85vh;
        max-height: 750px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 28px;
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        display: grid;
        grid-template-columns: 1.15fr 1.85fr;
        overflow: hidden;
        box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8),
                    0 0 100px rgba(255, 213, 79, 0.03);
        animation: borderGlowShift 8s infinite ease-in-out;
        transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
      }

      .player-container.fullscreen {
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
        border-radius: 0;
        border: none;
      }

      /* ── CLEAN RECORDING MODE (UI HIDDEN) ── */
      .player-container.ui-hidden {
        grid-template-columns: 1fr;
        background: transparent;
        border: none;
        box-shadow: none;
        max-width: 100vw;
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
      }

      .player-container.ui-hidden .art-panel {
        display: none !important;
      }

      .player-container.ui-hidden .lyrics-panel {
        padding: 50px;
        background: transparent;
      }

      .player-container.ui-hidden .lyrics-scroll-area {
        padding: 42vh 0;
      }

      /* ── LEFT PANEL: ART & VISUALIZER ── */
      .art-panel {
        padding: 45px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        background: rgba(0, 0, 0, 0.3);
        position: relative;
      }

      .artist-info {
        text-align: center;
        margin-bottom: 15px;
      }

      /* Cover Art Card with 3D Float Shadow */
      .art-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        max-width: 260px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: transform 0.1s ease, box-shadow 0.1s ease;
        will-change: transform, box-shadow;
      }

      .art-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        user-select: none;
        -webkit-user-drag: none;
      }

      /* Web Audio Frequency Spectrum Canvas */
      #spectrum-canvas {
        width: 100%;
        height: 70px;
        margin: 20px 0;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255,255,255,0.02);
      }

      /* Media Controls */
      .controls-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .button-row {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .play-btn {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), #ffa000);
        color: #000;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(255, 213, 79, 0.3);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .play-btn:hover {
        transform: scale(1.1) translateY(-2px);
        box-shadow: 0 15px 35px var(--primary-glow);
      }

      .play-btn svg {
        width: 26px;
        height: 26px;
        fill: currentColor;
      }

      .action-btn {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        color: rgba(255,255,255,0.8);
        padding: 10px 20px;
        border-radius: 25px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        letter-spacing: 0.5px;
        transition: all 0.3s;
      }

      .action-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.2);
        color: var(--primary);
        transform: translateY(-1px);
      }

      /* ── LYRICS PANEL ── */
      .lyrics-panel {
        padding: 50px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        background: rgba(0, 0, 0, 0.45);
        transition: padding 0.5s ease;
      }

      /* Mask fade gradient on top and bottom */
      .lyrics-panel::before, .lyrics-panel::after {
        content: '';
        position: absolute;
        left: 0;
        width: 100%;
        height: 20%;
        z-index: 5;
        pointer-events: none;
      }

      .lyrics-panel::before {
        top: 0;
        background: linear-gradient(to bottom, rgba(5,5,5,0.95) 0%, transparent 100%);
      }

      .lyrics-panel::after {
        bottom: 0;
        background: linear-gradient(to top, rgba(5,5,5,0.95) 0%, transparent 100%);
      }

      .lyrics-scroll-area {
        flex: 1;
        overflow-y: auto;
        scroll-behavior: smooth;
        padding: 30vh 0;
        display: flex;
        flex-direction: column;
        gap: 30px;
        scrollbar-width: none;
        transition: padding 0.5s ease;
      }

      .lyrics-scroll-area::-webkit-scrollbar {
        display: none;
      }

      .lyric-line {
        display: block;
        text-align: center;
        cursor: pointer;
        padding: 12px 30px;
        transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        box-sizing: border-box;
        width: 100%;
      }

      .sub-line {
        display: inline-block;
        margin: 0 4px;
        transition: all 0.4s ease;
      }

      /* Inactive State */
      .lyric-line .sub-line span {
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.22);
        font-size: 1.5rem;
        text-transform: uppercase;
        display: inline-block;
        transition: all 0.4s ease;
      }

      /* Hover standard and emphasis words uniformly when inactive */
      .lyric-line:hover .sub-line span {
        color: rgba(255, 255, 255, 0.6);
      }

      /* Active State: Explode into right-aligned vertical stack layout */
      .lyric-line.active {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        text-align: right;
      }

      .lyric-line.active .sub-line {
        display: flex;
        width: 100%;
        justify-content: flex-end;
        margin: 4px 0;
      }

      /* Active standard words */
      .lyric-line.active .standard-words span {
        color: #ffffff;
        font-size: 2.2rem;
        font-family: 'Outfit', sans-serif;
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      }

      /* Active emphasis words: massive hot pink, graffiti font, 3D shadow */
      .lyric-line.active .emphasis-word-container span.emphasis-word {
        font-family: 'Permanent Marker', cursive;
        color: #ff007f;
        font-size: 5.6rem;
        font-weight: 900;
        transform-origin: right center;
        display: inline-block;
        text-shadow: 
          1px 1px 0px #000, 
          2px 2px 0px #000, 
          3px 3px 0px #000, 
          4px 4px 0px #000, 
          5px 5px 0px #000,
          6px 6px 0px #000,
          0 0 20px rgba(255, 0, 127, 0.8),
          0 0 40px rgba(255, 0, 127, 0.4);
        animation: popInEmphasis 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      }

      @keyframes popIn {
        0% { transform: scale(0.6) translateY(10px); opacity: 0; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
      }

      @keyframes popInEmphasis {
        0% { transform: scale(0.2) rotate(-10deg) translateY(20px); opacity: 0; filter: blur(4px); }
        100% { transform: scale(1.1) rotate(-3deg) translateY(0); opacity: 1; filter: blur(0); }
      }

      /* Responsive Layout */
      @media (max-width: 850px) {
        .player-container {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
          height: 98vh;
        }

        .art-panel {
          border-right: none;
          border-bottom: 1px solid var(--border);
          padding: 25px;
          flex-direction: row;
          align-items: center;
          gap: 20px;
        }

        .art-wrapper {
          max-width: 90px;
        }

        .artist-info {
          text-align: left;
          margin-bottom: 0;
        }

        .controls-wrapper {
          flex: 1;
        }

        #spectrum-canvas {
          display: none;
        }

        .lyrics-panel {
          padding: 30px 25px;
        }

        .lyric-line {
          font-size: 1.4rem;
        }
      }
    
      /* Center credits lines */
      .lyric-line.credits-line {
        display: block !important;
        text-align: center !important;
        margin: 30px auto !important;
        width: 100% !important;
        opacity: 0.65;
        transition: opacity 0.3s ease;
      }
      .lyric-line.credits-line.active {
        opacity: 1 !important;
      }
      .credits-static-text {
        font-family: 'Outfit', sans-serif;
        font-size: 0.95rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.6);
        letter-spacing: 1.5px;
        text-transform: uppercase;
        display: inline-block;
        white-space: nowrap;
        text-shadow: 0 2px 8px rgba(0,0,0,0.6);
      }
    </style>
  </head>
  <body>

    <!-- ── Ambient Background (Fallback/Blurred Album Art) ── -->
    <div class="ambient-bg-container" aria-hidden="true">
      <div class="ambient-bg"></div>
    </div>
    
    <!-- ── Looping Background Video (Lightning Strikes) ── -->
    <video id="bg-video" autoplay loop muted playsinline aria-hidden="true" controlslist="nodownload" disablepictureinpicture oncontextmenu="return false;">
      <source src="assets/lyrics_video/one-of-them-days-base.mp4" type="video/mp4">
    </video>

    <div class="bg-overlay" aria-hidden="true"></div>

    <!-- Floating UI Toggle Button (displays when left panel is hidden) -->
    <button id="floating-ui-toggle" style="position: fixed; top: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px 16px; border-radius: 20px; font-family: inherit; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.3s; opacity: 0; pointer-events: none; backdrop-filter: blur(10px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);" onclick="toggleUI()">Show Player UI</button>

    <!-- ── Player Glassmorphism Container ── -->
    <div class="player-container" id="player-container">
      
      <!-- Left Panel: Cover Art and Interactive Visualizer -->
      <div class="art-panel">
        <div class="artist-info" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
          <img src="assets/henna-c-header-logo.png" alt="Henna C Logo" style="max-height: 55px; width: auto; max-width: 100%; filter: drop-shadow(0 0 15px rgba(255, 213, 79, 0.25)); margin-bottom: 5px; user-select: none; -webkit-user-drag: none;">
        </div>

        <div class="art-wrapper" id="art-card">
          <img src="assets/one-of-them-days.png" alt="Cover Art">

        <!-- Non-clickable Social Media Logos -->
        <div class="socials-wrapper" style="display: flex; gap: 30px; margin-top: 25px; margin-bottom: 5px; align-items: center; justify-content: center; width: 100%;">

          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
            <div class="social-icon-container" style="width: 44px; height: 44px; border-radius: 50%; background: #1877F2; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(24, 119, 242, 0.4);">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="#ffffff" style="pointer-events: none;"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.8c4.56-.93 8-4.96 8-9.8z"/></svg>
            </div>

          <!-- TikTok -->

              <svg width="26" height="26" viewBox="0 0 24 24" fill="#ffffff" style="pointer-events: none; filter: drop-shadow(-1.5px -1px 0 #00f2fe) drop-shadow(1.5px 1px 0 #fe0979);"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.02 1.59 4.23.85.98 2.02 1.69 3.29 2.02.03 1.35.01 2.69.02 4.04-.95-.08-1.89-.39-2.73-.87a7.227 7.227 0 0 1-2.48-2.46c-.05 2.16-.01 4.31-.03 6.47-.09 1.48-.56 2.94-1.39 4.19-.89 1.28-2.19 2.24-3.66 2.72-1.78.61-3.77.58-5.52-.11-1.63-.61-3.04-1.79-3.94-3.34A9.227 9.227 0 0 1 1 12.98c.03-1.92.65-3.83 1.77-5.38 1.12-1.5 2.76-2.55 4.58-2.94 1.25-.29 2.56-.16 3.74.37.02 1.44-.01 2.87.01 4.3-.67-.28-1.42-.37-2.13-.24a3.864 3.864 0 0 0-2.31 1.39c-.64.78-.96 1.81-.88 2.82.07.97.55 1.89 1.31 2.51.81.65 1.87.95 2.9.82 1.05-.1 2.01-.69 2.58-1.58.37-.58.55-1.27.52-1.96.03-4.36.01-8.72.02-13.08z"/></svg>

        <!-- Real Frequency Spectrum Visualizer -->

          <!-- Play / Pause & Hide UI Buttons -->

    <!-- ── Audio Element ── -->

      <source src="assets/audio/falling-apart.wav" type="audio/wav">

    <script>
      const audio = document.getElementById('audio-player');
      const playBtn = document.getElementById('play-btn');
      const playIcon = document.getElementById('play-icon');
      const pauseIcon = document.getElementById('pause-icon');
      const hideUiBtn = document.getElementById('hide-ui-btn');
      const lyricsScroll = document.getElementById('lyrics-scroll');
      const playerContainer = document.getElementById('player-container');
      const spectrumCanvas = document.getElementById('spectrum-canvas');
      const spectrumCtx = spectrumCanvas.getContext('2d');
      const artCard = document.getElementById('art-card');
      const ambientBg = document.querySelector('.ambient-bg');
      const bgVideo = document.getElementById('bg-video');

      let activeIndex = -1;
      let lyrics = [];

      const track = {
        title: "One Of Them Days",
        lyrics: [
          { "time": 2.15, "text": "It feels like one of them days again" },
          { "time": 7.37, "text": "Yeah" },
          { "time": 9.38, "text": "one of them days again" },
          { "time": 12.11, "text": "Late nights, same thoughts, same walls" },
          { "time": 15.11, "text": "Still here though" },
          { "time": 18.59, "text": "You ever hurt so much" },
          { "time": 21.32, "text": "You forget what peace feels like" },
          { "time": 27.53, "text": "one of them days again" },
          { "time": 29.84, "text": "It feels like one of them days again" },

      // ── WEB AUDIO API SETUP FOR AUDIO REACTIVE PULSING ──
      let audioCtx, analyser, sourceNode;
      let dataArray;
      
      function initAudioAnalyzer() {
        if (audioCtx) return;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 64; // Bass-focused
          
          sourceNode = audioCtx.createMediaElementSource(audio);
          sourceNode.connect(analyser);
          analyser.connect(audioCtx.destination);
          
          dataArray = new Uint8Array(analyser.frequencyBinCount);
        } catch (e) {
          console.warn("Web Audio API not supported or blocked:", e);
        }
      }

      // Load lyrics
      function loadLyrics(lyricsData) {
        lyrics = lyricsData.map((line, lineIdx) => {
          const words = line.text.split(' ').filter(w => w.trim().length > 0);
          const startTime = line.time;
          
          let nextTime = startTime + 3.0;
          if (lineIdx + 1 < lyricsData.length) {
            nextTime = lyricsData[lineIdx + 1].time;
          } else if (audio && audio.duration && !isNaN(audio.duration)) {
            nextTime = audio.duration;
          }
          
          const duration = nextTime - startTime;
          const speechDuration = Math.min(duration, words.length * 0.35);
          
          const wordsArray = words.map((w, wIdx) => {
            const relativeTime = (wIdx / words.length) * speechDuration;
            return { w: w, t: startTime + relativeTime };
          });
          
          return {
            time: startTime,
            text: line.text,
            words: wordsArray
          };
        });
        
        renderLyrics();
        activeIndex = -1;
      }

      function formatLyricText(lineObj) {
        const emphasisWords = new Set([
          'days', 'pain', 'place', 'crying', 'mind', 'fine', 'stress', 'weight', 'lost', 'together', 
          'heavy', 'chest', 'falling', 'okay', 'hope', 'low', 'lower', 'hit', 'hard', 'differently', 
          'mirror', 'touch', 'fight', 'face', 'pretty', 'gross', 'heartbroken', 'door', 'survived', 
          'enough', 'rise', 'tomorrow', 'henna', 'c'
        ]);

        let resultHtml = '';
        let spanIndex = 0;

        lineObj.words.forEach(wordObj => {
          const word = wordObj.w;
          const t = wordObj.t;
          if (!word.trim()) return;
          const cleanWord = word.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?\"']/g, "");
          spanIndex++;
          const delay = (spanIndex * 0.04).toFixed(2);
          if (emphasisWords.has(cleanWord)) {
            resultHtml += `<div class="sub-line emphasis-word-container"><span class="emphasis-word" data-time="${t}" style="animation-delay: ${delay}s">${word}</span></div>`;
          } else {
            resultHtml += `<div class="sub-line standard-words"><span data-time="${t}" style="animation-delay: ${delay}s">${word}</span></div>`;
          }
        });

        return resultHtml;
      }

      // Render lyrics into scroll panel
      function renderLyrics() {
        lyricsScroll.innerHTML = '';
        lyrics.forEach((item, idx) => {
          const div = document.createElement('div');
          div.className = 'lyric-line';
          div.id = `line-${idx}`;
          
          const isCredits = item.text.toLowerCase().includes("songwriter:") || 
                            item.text.toLowerCase().includes("producer:");
          
          if (isCredits) {
            div.classList.add('credits-line');
            const cleanText = item.text.replace(/\s*\|\s*/g, " &nbsp; &nbsp; &nbsp; ");
            div.innerHTML = `<span class="credits-static-text">${cleanText}</span>`;
          } else {
            div.innerHTML = formatLyricText(item);
          }

          div.addEventListener('click', () => {
            audio.currentTime = item.time;
            updateLyrics(item.time);
            if (audio.paused) togglePlay();
          });
          lyricsScroll.appendChild(div);
        });
      }

      // Update active lyric based on current time
      function updateLyrics(time) {
        let currentIdx = -1;
        for (let i = 0; i < lyrics.length; i++) {
          if (time >= lyrics[i].time) {
            currentIdx = i;
          } else {
            break;
          }
        }

        if (currentIdx !== activeIndex) {
          if (activeIndex >= 0) {
            const oldLine = document.getElementById(`line-${activeIndex}`);
            if (oldLine) oldLine.classList.remove('active');
          }

          activeIndex = currentIdx;
          if (activeIndex >= 0) {
            const newLine = document.getElementById(`line-${activeIndex}`);
            if (newLine) {
              newLine.classList.add('active');
              const scrollOffset = newLine.offsetTop - (lyricsScroll.clientHeight / 2) + (newLine.clientHeight / 2);
              lyricsScroll.scrollTo({
                top: scrollOffset,
                behavior: 'smooth'
              });
            }
          }
        }
      }

      // Toggle Play/Pause
      function togglePlay() {
        initAudioAnalyzer();
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        if (audio.paused) {
          audio.play();
          bgVideo.play().catch(err => console.log("Video play failed or delayed:", err));
          document.body.classList.add('playing');
          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
        } else {
          audio.pause();
          bgVideo.pause();
          document.body.classList.remove('playing');
          playIcon.style.display = 'block';
          pauseIcon.style.display = 'none';
        }
      }

      playBtn.addEventListener('click', togglePlay);

      // Keyboard Controls
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault();
          togglePlay();
        }
        if (e.code === 'KeyH') {
          e.preventDefault();
          toggleUI();
        }
        if (e.code === 'KeyF') {
          e.preventDefault();
          toggleFullscreen();
        }
      });

      // UI Toggling Logic
      function toggleUI() {
        const isHidden = playerContainer.classList.toggle('ui-hidden');
        const floatingBtn = document.getElementById('floating-ui-toggle');
        
        if (isHidden) {
          floatingBtn.style.opacity = '1';
          floatingBtn.style.pointerEvents = 'auto';
        } else {
          floatingBtn.style.opacity = '0';
          floatingBtn.style.pointerEvents = 'none';
        }
        
        // Force scroll alignment update
        if (activeIndex >= 0) {
          const activeLine = document.getElementById(`line-${activeIndex}`);
          if (activeLine) {
            const scrollOffset = activeLine.offsetTop - (lyricsScroll.clientHeight / 2) + (activeLine.clientHeight / 2);
            lyricsScroll.scrollTop = scrollOffset;
          }
        }
      }

      hideUiBtn.addEventListener('click', toggleUI);

      // Timeupdate events
      audio.addEventListener('timeupdate', () => {
        updateLyrics(audio.currentTime);
      });

      // Fullscreen
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          playerContainer.requestFullscreen().then(() => {
            playerContainer.classList.add('fullscreen');
          }).catch(err => console.error("Fullscreen error:", err));
        } else {
          document.exitFullscreen();
        }
      }

      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement) {
          playerContainer.classList.remove('fullscreen');
        }
      });

      // ── REALTIME SPECTRUM VISUALIZER & DYNAMIC BEAT-PUMPING ──
      spectrumCanvas.width = 300;
      spectrumCanvas.height = 70;

      function renderFrame() {
        requestAnimationFrame(renderFrame);
        
        let avgVolume = 0;
        
        if (analyser && !audio.paused) {
          analyser.getByteFrequencyData(dataArray);
          
          let total = 0;
          for (let i = 0; i < dataArray.length; i++) {
            total += dataArray[i];
          }
          avgVolume = total / dataArray.length;
        }

        // Draw frequency spectrum bars if UI is visible
        if (spectrumCtx && !playerContainer.classList.contains('ui-hidden')) {
          spectrumCtx.clearRect(0, 0, spectrumCanvas.width, spectrumCanvas.height);
          
          const barWidth = (spectrumCanvas.width / 32) - 3;
          let x = 0;
          
          for (let i = 0; i < 32; i++) {
            const val = analyser && !audio.paused ? dataArray[i] : 10;
            const h = (val / 255) * spectrumCanvas.height * 0.9 + 4;
            
            const grad = spectrumCtx.createLinearGradient(0, spectrumCanvas.height, 0, spectrumCanvas.height - h);
            grad.addColorStop(0, 'rgba(255, 160, 0, 0.4)');
            grad.addColorStop(1, 'rgba(255, 213, 79, 0.9)');
            
            spectrumCtx.fillStyle = grad;
            spectrumCtx.beginPath();
            spectrumCtx.roundRect(x, spectrumCanvas.height - h, barWidth, h, 2);
            spectrumCtx.fill();
            
            x += barWidth + 3;
          }
        }

        // ── BEAT RESPONSIVE MOTION ──
        if (avgVolume > 0) {
          // Pump cover art card
          const pump = 1 + (avgVolume / 255) * 0.16;
          artCard.style.transform = `scale(${pump})`;
          artCard.style.boxShadow = `0 ${20 + (avgVolume/255)*30}px ${40 + (avgVolume/255)*40}px rgba(255, 213, 79, ${(avgVolume/255)*0.4 + 0.3})`;
          
          // Pump player container (only when UI is visible)
          if (!playerContainer.classList.contains('ui-hidden')) {
            const containerPump = 1 + (avgVolume / 255) * 0.02;
            let shakeX = 0;
            let shakeY = 0;
            if (avgVolume > 65) {
              shakeX = (Math.random() - 0.5) * 12 * (avgVolume / 255);
              shakeY = (Math.random() - 0.5) * 12 * (avgVolume / 255);
            }
            playerContainer.style.transform = `scale(${containerPump}) translate(${shakeX}px, ${shakeY}px)`;
            playerContainer.style.boxShadow = `0 50px 100px rgba(0, 0, 0, 0.8), 0 0 ${20 + (avgVolume/255)*60}px rgba(255, 213, 79, ${(avgVolume/255)*0.5})`;
          } else {
            playerContainer.style.transform = 'none';
            playerContainer.style.boxShadow = 'none';
          }
          
          // Pulse background video (Brightness and scale flash to beat!)
          const videoPump = 1.02 + (avgVolume / 255) * 0.08;
          const brightnessVal = 0.35 + (avgVolume / 255) * 0.55; // flashes/brightens with drops!
          const saturateVal = 1.0 + (avgVolume / 255) * 0.8;
          bgVideo.style.transform = `scale(${videoPump})`;
          bgVideo.style.filter = `brightness(${brightnessVal}) saturate(${saturateVal})`;
          
          // Ambient blur fallback pulses too
          const bgPump = 1.05 + (avgVolume / 255) * 0.08;
          const bgBlur = Math.max(8, 20 - (avgVolume / 255) * 12);
          ambientBg.style.transform = `scale(${bgPump})`;
          ambientBg.style.filter = `blur(${bgBlur}px) brightness(${0.28 + (avgVolume/255)*0.12}) saturate(${1.3 + (avgVolume/255)*0.5})`;
        } else {
          artCard.style.transform = `scale(1)`;
          artCard.style.boxShadow = `0 20px 40px rgba(0, 0, 0, 0.6)`;
          
          if (!playerContainer.classList.contains('ui-hidden')) {
            playerContainer.style.transform = `scale(1) translate(0, 0)`;
            playerContainer.style.boxShadow = `0 50px 100px rgba(0, 0, 0, 0.8), 0 0 100px rgba(255, 213, 79, 0.03)`;
          }
          
          bgVideo.style.transform = `scale(1)`;
          bgVideo.style.filter = `brightness(0.35) saturate(1.0)`;
          
          ambientBg.style.transform = `scale(1.05)`;
          ambientBg.style.filter = `blur(25px) brightness(0.28) saturate(1.3)`;
        }

        // ── WORD HIGHLIGHT KARAOKE ──
        if (activeIndex >= 0) {
          const activeLine = document.getElementById(`line-${activeIndex}`);
          if (activeLine) {
            const spans = activeLine.querySelectorAll('.sub-line span');
            if (spans.length > 0) {
              const currentTime = audio.currentTime;
              let activeSpanIdx = -1;
              
              for (let i = 0; i < spans.length; i++) {
                const t = parseFloat(spans[i].getAttribute('data-time'));
                if (!isNaN(t) && currentTime >= t) {
                  activeSpanIdx = i;
                } else if (!isNaN(t) && currentTime < t) {
                  break;
                }
              }
              
              spans.forEach((span, idx) => {
                if (idx < activeSpanIdx) {
                  // Past word
                  span.classList.add('past');
                  span.classList.remove('spoken');
                  span.style.opacity = '0.7';
                  span.style.color = '#ffffff';
                  if (span.classList.contains('emphasis-word')) {
                    span.style.transform = 'scale(1.0) rotate(-1.5deg)';
                    span.style.textShadow = `
                      1px 1px 0px #000, 
                      2px 2px 0px #000, 
                      3px 3px 0px #000, 
                      4px 4px 0px #000, 
                      0 0 10px rgba(255, 0, 127, 0.4)
                    `;
                  } else {
                    span.style.transform = 'scale(1)';
                    span.style.textShadow = 'none';
                  }
                } else if (idx === activeSpanIdx && !audio.paused) {
                  // Spoken active word
                  span.classList.add('spoken');
                  span.classList.remove('past');
                  span.style.opacity = '1.0';
                  
                  if (span.classList.contains('emphasis-word')) {
                    span.style.color = '#ff007f';
                    const empPump = 1.15 + (avgVolume / 255) * 0.35;
                    const wobbleRotate = -3 + (avgVolume / 255) * 8 * Math.sin(Date.now() / 100);
                    const wobbleSkew = -5 + (avgVolume / 255) * 6 * Math.cos(Date.now() / 100);
                    span.style.transform = `scale(${empPump}) rotate(${wobbleRotate}deg) skewX(${wobbleSkew}deg)`;
                    span.style.textShadow = `
                      1px 1px 0px #000, 
                      2px 2px 0px #000, 
                      3px 3px 0px #000, 
                      4px 4px 0px #000, 
                      5px 5px 0px #000,
                      6px 6px 0px #000,
                      0px 0px ${15 + (avgVolume/255)*25}px rgba(255, 0, 127, 0.95),
                      0px 0px ${30 + (avgVolume/255)*45}px rgba(255, 0, 127, 0.5)
                    `;
                  } else {
                    span.style.color = '#ffd54f';
                    const stdPump = 1.05 + (avgVolume / 255) * 0.15;
                    span.style.transform = `scale(${stdPump})`;
                    span.style.textShadow = `0 2px 10px rgba(0,0,0,0.5), 0 0 ${10 + (avgVolume/255)*15}px rgba(255, 213, 79, 0.85)`;
                  }
                } else {
                  // Future word
                  span.classList.remove('spoken');
                  span.classList.remove('past');
                  span.style.opacity = '0.22';
                  span.style.color = '#ffffff';
                  span.style.transform = 'scale(1)';
                  span.style.textShadow = 'none';
                }
              });
            }
          }
        } else {
          const activeSpans = document.querySelectorAll('.lyric-line span');
          activeSpans.forEach(span => {
            span.classList.remove('past', 'spoken');
            span.style.opacity = '0.22';
            span.style.transform = '';
            span.style.textShadow = '';
          });
        }
      }

      loadLyrics(track.lyrics);
      renderFrame();

      // Right-click and DevTools protection
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.addEventListener('dragstart', e => e.preventDefault());
      document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 's') e.preventDefault();
        if (e.key === 'F12') e.preventDefault();
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) e.preventDefault();
        if ((e.ctrlKey || e.metaKey) && e.altKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c' || e.key === 'J' || e.key === 'j')) e.preventDefault();
        if ((e.ctrlKey || e.metaKey) && (e.key === 'U' || e.key === 'u')) e.preventDefault();
      });
    </script>
  </body>
